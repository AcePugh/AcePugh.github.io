<script>
    /* Make basemaps mutually exclusive (radio button behavior) */
    /* Wait for page to fully load before running script */
    document.addEventListener('DOMContentLoaded', function() {
        /* Wait 500ms for map to initialize before modifying controls */
        setTimeout(function() {
            /* Array of basemap names that should be mutually exclusive */
            var basemapNames = ['OpenStreetMap', 'Light Gray', 'Satellite'];
            
            /* Find all layer control checkboxes for overlays */
            var layerControlInputs = document.querySelectorAll('.leaflet-control-layers-overlays input[type="checkbox"]');
            
            /* Create array to store basemap checkboxes and their names */
            var basemapCheckboxes = [];
            /* Loop through each checkbox found */
            layerControlInputs.forEach(function(checkbox) {
                /* Get the label element next to the checkbox */
                var label = checkbox.nextSibling;
                /* Check if label exists and has text content */
                if (label && label.textContent) {
                    /* Get the layer name from label text */
                    var layerName = label.textContent.trim();
                    /* Check if this layer is one of our basemaps */
                    if (basemapNames.includes(layerName)) {
                        /* Add checkbox and name to our tracking array */
                        basemapCheckboxes.push({
                            checkbox: checkbox,
                            name: layerName
                        });
                    }
                }
            });
            
            /* Add click handlers to enforce mutual exclusivity */
            /* Loop through each basemap checkbox */
            basemapCheckboxes.forEach(function(item) {
                /* Add change event listener to checkbox */
                item.checkbox.addEventListener('change', function() {
                    /* If this checkbox was just checked */
                    if (this.checked) {
                        /* Uncheck all other basemap checkboxes */
                        /* Loop through all basemap checkboxes */
                        basemapCheckboxes.forEach(function(otherItem) {
                            /* If this is a different checkbox and it's currently checked */
                            if (otherItem.checkbox !== item.checkbox && otherItem.checkbox.checked) {
                                /* Click it to uncheck and properly remove the layer */
                                otherItem.checkbox.click();
                            }
                        });
                    }
                });
            });
        }, 500); /* Wait 500 milliseconds for map to fully initialize */
    });
</script>
